name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t julia-api -f docker/Dockerfile .

      - name: Smoke test — container starts and responds to /health
        run: |
          docker run -d -p 8080:8080 --name julia-api julia-api
          status=1
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/health; then status=0; break; fi
            sleep 1
          done
          if [ "$status" -ne 0 ]; then echo "Service did not become healthy in time"; fi
          echo "--- container logs ---"
          docker logs julia-api
          docker rm -f julia-api
          exit $status
